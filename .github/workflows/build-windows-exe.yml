name: Build Windows Desktop Installer (.exe & .msi)

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Production Cloud API URL (e.g. https://your-app.run.app)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2.0.0"

      - name: Build Windows .exe (NSIS) & .msi installers
        env:
          VITE_API_BASE_URL: ${{ inputs.api_base_url || vars.VITE_API_BASE_URL }}
        run: npm run desktop:build

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: grand-group-procurement-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
